version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: odoo_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  odoo:
    image: python:3.11-slim
    working_dir: /ws
    command: >
      bash -lc "apt-get update && apt-get install -y --no-install-recommends build-essential
      && pip install -r odoo/requirements.txt && pip install rjsmin==1.2.2
      && python odoo/odoo-bin --addons-path=odoo/addons,addons_custom
         --db_host=db --db_user=postgres --db_password=odoo --db_port=5432
         --http-port=8069 --dev=all"
    volumes:
      - ./:/ws
    ports: ["8069:8069"]
    depends_on: [db]
volumes: { pgdata: {} }
